name: Deploy to EC2

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH Setup
        run: |
          echo "=== SSH Key Info ==="
          ls -la ~/.ssh/
          echo "=== First line of key ==="
          head -n 1 ~/.ssh/id_rsa
          echo "=== Last line of key ==="
          tail -n 1 ~/.ssh/id_rsa
          echo "=== Line count ==="
          wc -l ~/.ssh/id_rsa
          echo "=== Key permissions ==="
          stat -c "%a %n" ~/.ssh/id_rsa
          echo "=== Trying to extract key type ==="
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "Key format issue!"

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'Connection successful'"

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/business-management/backend &&
            git pull origin deployment &&
            npm install &&
            pm2 restart node-service
          "

      - name: Deploy Frontend
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/business-management/frontend &&
            git pull origin deployment &&
            npm install &&
            npm run build &&
            sudo rm -rf /var/www/html/* &&
            sudo cp -r .next public package.json /var/www/html/ &&
            sudo chown -R www-data:www-data /var/www/html
          "